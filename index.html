<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Connect — Report. Track. Resolve.</title>
    <meta name="description" content="Civic Connect is the citizen engagement platform to report local issues, track resolutions and connect with your community.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div id="globalLoader">
        <div class="spinner"></div>
        <p class="spinner-text">Authenticating...</p>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="glass-card auth-card">
        <!-- Brand -->
        <div class="auth-brand-area">
            <div class="brand">
                <div class="brand-logo">C</div>
                <div>
                    <div class="brand-name">Civic Connect</div>
                    <span class="brand-tagline">Citizen Portal</span>
                </div>
            </div>
            <p class="auth-tagline" style="margin-top: 12px;">
                Report local issues, track resolutions &amp; strengthen your community.
            </p>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="setAuthTab('login')">Sign In</button>
            <button class="auth-tab" id="tabRegister" onclick="setAuthTab('register')">Create Account</button>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form id="loginForm" class="form-stack">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <input type="text" id="loginUsername" placeholder="Enter your username" autocomplete="username" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 6px;">
                Sign In
            </button>

            <div class="auth-divider">OR</div>
            <div class="oauth-buttons">
                <a href="http://localhost:8000/oauth2/authorization/google" class="oauth-btn">
                    <span>🔵</span> Google
                </a>
                <a href="http://localhost:8000/oauth2/authorization/github" class="oauth-btn">
                    <span>⚫</span> GitHub
                </a>
            </div>
        </form>

        <!-- ===== REGISTER FORM ===== -->
        <form id="registerForm" class="form-stack hidden">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="regFullName" placeholder="Jane Doe" autocomplete="name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="regEmail" placeholder="jane@example.com" autocomplete="email" required>
                </div>
                <div class="availability-indicator" id="emailAvail"></div>
            </div>
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <input type="text" id="regUsername" placeholder="janedoe99" autocomplete="username" required>
                </div>
                <div class="availability-indicator" id="usernameAvail"></div>
            </div>
            <div class="form-group">
                <label>Password <span style="color: var(--text-muted); font-weight: 400;">(min 6 characters)</span></label>
                <div class="input-wrapper">
                    <input type="password" id="regPassword" placeholder="Create a strong password" autocomplete="new-password" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 6px;">
                Send Verification Code
            </button>
        </form>
    </div>

    <!-- OTP MODAL -->
    <div id="otpModal" class="modal-overlay hidden">
        <div class="glass-card modal-card">
            <div class="modal-icon">📨</div>
            <h2 class="modal-title">Check Your Email</h2>
            <p class="modal-subtitle">We sent a 6-digit verification code to<br><strong id="otpEmailTarget" style="color: white;"></strong></p>
            <div class="input-wrapper">
                <input type="text" id="modalOtpInput" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="\d{6}">
            </div>
            <button type="button" id="btnVerifyAndRegister" class="btn-primary">
                Verify &amp; Create Account
            </button>
            <p class="otp-resend">Didn't receive it? <a onclick="resendOtp()">Resend code</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function setAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabRegister').classList.toggle('active', !isLogin);
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
        }
    </script>
</body>
</html>
